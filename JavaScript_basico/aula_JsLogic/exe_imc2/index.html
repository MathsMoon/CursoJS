<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>IMC Site</title>
</head>
<body class="main-bg">
    <section class="secondary-bg section">
        <h1>TABELA IMC</h1>
        <div class="grid-table">
            <div class="grid-content">
                <h2>IMC</h2>
                <p>
                    Menos do que 18,5<br>
                    Entre 18,5 e 24,9<br>
                    Entre 25 e 29,9<br>
                    Entre 30 e 34,9<br>
                    Entre 35 e 39,9<br>
                    Mais do que 40
                </p>
                <h2>Resultado</h2>
                <p>
                    Abaixo do Peso<br>
                    Peso normal<br>
                    Sobrepeso<br>
                    Obesidade grau 1<br>
                    Obesidade grau 2<br>
                    Obesidade grau 3
                </p>
            </div>
        </div>
        <div class="div-display">
            <h1>Calcule seu IMC</h1>
            <p>Peso: <input type="text" name="weight" id="weight"></p>
            <p>Altura: <input type="text" name="height" id="height"></p>
            <button type="submit">Calcular</button>
            <p class="showing-result"></p>
        </div>
    </section>
</body>
</html>
