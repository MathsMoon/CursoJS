<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Temporizador</title>
</head>
<body>
    <!-- Seção que divide a área designada a atividade -->
    <section class="container">
        <h1>Meu Timer:</h1>
        
        <!-- Seção manipulada pelo Timer -->
        <p class="timer">00:00:00</p>
        
        <!-- Seção de funcionalidade do Timer -->
        <p class="buttons">
            <button class="start">Iniciar</button>
            <button class="pause">Pausar</button>
            <button class="restart">Reiniciar</button>
        </p>
    </section>
</body>
</html>
