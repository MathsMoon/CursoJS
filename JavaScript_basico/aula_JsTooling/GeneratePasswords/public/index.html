<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <script src="./assets/js/bandle.js" defer></script>
  <title>Modelo</title>
</head>

<body>
  <section class="container">
    <h1>Gerador de Senhas</h1>
    <p>Bem-vindo ao Melhor gerador de senhas do host local!</p>
    <h3>Selecione suas preferências abaixo:</h3>

    Quantidade de caracteres <input value="20" type="number" min="1" max="30" class="qtd-characters"><br>
    Adicionar maiúsculas <input type="checkbox" class="chk-maiusculas"><br>
    Adicionar minúsculas <input type="checkbox" class="chk-minusculas"><br>
    Adicionar números <input type="checkbox" class="chk-nums"><br>
    Adicionar símbolos <input type="checkbox" class="chk-simbols"><br>
    <button class="submit">Gerar senha</button>
    <button class="erase">Limpar Formulário</button>
    <div class="showingPassword"></div>
  </section>
</body>
</html>
